<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>k8s-pod-recommender — run the recommender in your browser</title>
<meta name="description" content="Paste pod specs and get the same conservative verdicts the k8s-pod-recommender CLI gives: fix / set / tighten / investigate / watch / keep. Runs entirely in the browser — no metrics server needed.">
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel-2:#1c2230;--text:#e6edf3;--muted:#8b949e;--line:#30363d;--fix:#f85149;--set:#d29922;--investigate:#a371f7;--tighten:#58a6ff;--watch:#3fb950;--keep:#6e7681}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(760px 460px at 8% -10%,rgba(88,166,255,.12),transparent 60%),radial-gradient(700px 450px at 95% 0%,rgba(163,113,247,.10),transparent 55%),var(--bg);color:var(--text);font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1160px;margin:0 auto;padding:22px 20px 56px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:21px;margin:0}
h1 code{color:var(--tighten);font-size:.82em}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--muted);font-size:12.5px;cursor:pointer;transition:.15s;text-decoration:none}
.btn:hover{color:var(--text);border-color:#3d4657;transform:translateY(-1px)}
.btn.primary{background:var(--tighten);border-color:transparent;color:#051321;font-weight:700}
.btn.primary:hover{filter:brightness(1.1)}
.btn svg{width:15px;height:15px}
.editor-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.editor-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.editor-h h2{margin:0;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
textarea{display:block;width:100%;height:180px;resize:vertical;border:0;outline:0;padding:14px;background:transparent;color:var(--text);font:12.5px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre;overflow:auto}
textarea::placeholder{color:#48525f}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:.15s;border-top:2px solid transparent}
.card:hover{transform:translateY(-2px)}
.card.active{border-top-color:var(--accent,var(--tighten))}
.card .n{font-size:22px;font-weight:700}
.card .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.card.fix .n{color:var(--fix)}.card.set .n{color:var(--set)}.card.investigate .n{color:var(--investigate)}.card.tighten .n{color:var(--tighten)}.card.watch .n{color:var(--watch)}.card.keep .n{color:var(--keep)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.panel-h h2{margin:0;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.search{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-size:12.5px;outline:none;min-width:170px}
.search:focus{border-color:var(--tighten)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:var(--panel-2)}
tbody tr:hover{background:rgba(88,166,255,.05)}
tbody tr:last-child td{border-bottom:0}
code{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;white-space:nowrap}
.badge{display:inline-block;padding:1px 10px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid currentColor;text-transform:lowercase}
.badge.fix{color:var(--fix)}.badge.set{color:var(--set)}.badge.investigate{color:var(--investigate)}.badge.tighten{color:var(--tighten)}.badge.watch{color:var(--watch)}.badge.keep{color:var(--keep)}
.reason{color:var(--muted);font-size:12px;max-width:430px}
.empty{color:var(--muted);text-align:center;padding:38px 12px}
.foot{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px;margin-top:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:9px 18px;border:1px solid var(--line);border-radius:10px;background:rgba(13,17,23,.97);font-size:13px;z-index:30}
.toast[hidden]{display:none}
.kbd{border:1px solid var(--line);border-radius:5px;padding:0 6px;font:11px ui-monospace,monospace;background:var(--panel-2)}
.err-box{margin:14px;border:1px solid rgba(248,81,73,.4);background:rgba(248,81,73,.08);color:#ffb3ab;border-radius:10px;padding:12px 14px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div>
      <h1><code>k8s-pod-recommender</code></h1>
      <div class="sub">Same rules as the CLI, running in your browser · conservative, no guessed numbers</div>
    </div>
    <div class="actions">
      <button class="btn" id="sampleBtn" title="Load 12 sample pods">Sample pods</button>
      <button class="btn" id="copyBtn" title="Copy JSON recommendations">Copy JSON</button>
      <button class="btn" id="soundBtn" title="Toggle sound">Sound</button>
      <a class="btn" href="https://github.com/Ankitavasudev/k8s-pod-recommender" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>

  <div class="editor-panel">
    <div class="editor-h">
      <h2>Pods JSON <span id="hint">· array of pod objects</span></h2>
      <button class="btn primary" id="analyzeBtn" style="padding:6px 16px">Analyze</button>
    </div>
    <textarea id="pods" spellcheck="false" placeholder='[{"name":"nginx","namespace":"default","status":"Running","restarts":0,"containers":1,"cpu_request":"250m","cpu_limit":"1","memory_request":"256Mi","memory_limit":"512Mi"}]'></textarea>
  </div>

  <div class="cards" id="cards"></div>

  <section class="panel" aria-label="Recommendations">
    <div class="panel-h">
      <h2>Recommendations <span id="rowCount"></span></h2>
      <input id="search" class="search" placeholder="Filter pod, namespace…" aria-label="Filter">
    </div>
    <div class="table-wrap">
      <table id="table">
        <thead><tr><th>Pod</th><th>Current</th><th>Suggested</th><th>Action</th><th>Reason</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <div class="foot">
    <span>Powered by the exact <code>pkg/recommender</code> rules · exit codes mirror the CLI · <a href="https://github.com/Ankitavasudev/k8s-pod-recommender" style="color:var(--tighten)">source</a></span>
    <span><span class="kbd">Ctrl</span>+<span class="kbd">Enter</span> analyze</span>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ================= sound ================= */
const Sound = (() => {
  let ctx = null, muted = localStorage.getItem('kpr-sound') === '0';
  const ensure = () => {
    if (!ctx) try { ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch { ctx = null; }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  const tone = (freq, dur, type='sine', gain=0.07, slide=0) => {
    if (muted) return; const c = ensure(); if (!c) return;
    const now = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, now);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq+slide), now+dur);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(gain, now+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now+dur);
    o.connect(g).connect(c.destination); o.start(now); o.stop(now+dur+0.02);
  };
  return {
    analyze: () => { tone(440,.05,'square',.05); setTimeout(()=>tone(587,.06,'square',.05),55); },
    bad:     () => tone(349,.2,'sawtooth',.07,-160),
    clean:   () => { tone(523,.08,'sine',.09); setTimeout(()=>tone(659,.08,'sine',.09),90); setTimeout(()=>tone(784,.12,'sine',.09),180); },
    copy:    () => tone(740,.04,'triangle',.06),
    toggleMute: () => { muted = !muted; localStorage.setItem('kpr-sound', muted ? '0' : '1'); if (!muted) tone(880,.06,'sine',.08); return muted; },
    isMuted: () => muted,
  };
})();

/* ============ recommender (ported from pkg/recommender) ============ */
const HEADROOM = 1.5, MINCPU = 0.1, MINMEM = 64;
const roundUp = (v, step) => Math.ceil(v / step - 1e-9) * step;
const calcCPU = usage => usage <= 0 ? MINCPU : Math.max(MINCPU, roundUp(usage * HEADROOM, 0.01));
const calcMem = usage => usage <= 0 ? MINMEM : Math.max(MINMEM, roundUp(usage * HEADROOM, 16));
const parseCPU = q => {
  q = String(q || '').trim(); if (!q) return 0;
  if (q.endsWith('m')) { const m = parseFloat(q.slice(0, -1)); return isNaN(m) ? 0 : m / 1000; }
  if (q.endsWith('n')) { const n = parseFloat(q.slice(0, -1)); return isNaN(n) ? 0 : n / 1e9; }
  const c = parseFloat(q); return isNaN(c) ? 0 : c;
};
const MEM_UNITS = [['Ki', 1/1024], ['Mi', 1], ['Gi', 1024], ['Ti', 1048576], ['K', 1000/1048576], ['M', 1e6/1048576], ['G', 1e9/1048576]];
const parseMem = q => {
  q = String(q || '').trim(); if (!q) return 0;
  for (const [suf, factor] of MEM_UNITS) if (q.endsWith(suf)) { const v = parseFloat(q.slice(0, -suf.length)); return isNaN(v) ? 0 : v * factor; }
  const b = parseFloat(q); return isNaN(b) ? 0 : b / 1048576;
};
const formatCPU = cores => {
  if (cores === 0) return '0';
  const r = Math.round(cores * 1000) / 1000;
  if (r < 1) return Math.round(r * 1000) + 'm';
  if (Number.isInteger(r)) return String(r);
  return String(r);
};
const formatMem = mib => (mib >= 1024 && mib % 1024 === 0) ? (mib / 1024) + 'Gi' : Math.round(mib) + 'Mi';
const containerCount = n => n === 1 ? '1 container' : n + ' containers';

function recommend(pod) {
  let containers = parseInt(pod.containers, 10) || 1; if (containers < 1) containers = 1;
  const rec = {
    pod: pod.name || '?', namespace: pod.namespace || 'default',
    current_cpu: pod.cpu_request ?? '', current_memory: pod.memory_request ?? '',
    recommended_cpu: pod.cpu_request ?? '', recommended_memory: pod.memory_request ?? '',
    action: 'keep', reason: 'No change needed',
  };
  const cpuReq = parseCPU(pod.cpu_request), cpuLim = parseCPU(pod.cpu_limit);
  const memReq = parseMem(pod.memory_request), memLim = parseMem(pod.memory_limit);

  if (cpuReq > 0 && cpuLim > 0 && cpuReq > cpuLim) {
    rec.action = 'fix';
    rec.reason = `CPU request (${pod.cpu_request}) exceeds limit (${pod.cpu_limit}) — the pod cannot schedule`;
    return rec;
  }
  if (memReq > 0 && memLim > 0 && memReq > memLim) {
    rec.action = 'fix';
    rec.reason = `Memory request (${pod.memory_request}) exceeds limit (${pod.memory_limit})`;
    return rec;
  }
  if (cpuReq === 0 && memReq === 0) {
    rec.action = 'set';
    rec.recommended_cpu = formatCPU(MINCPU * containers);
    rec.recommended_memory = formatMem(MINMEM * containers);
    rec.reason = `No resource requests on ${containerCount(containers)} — the scheduler cannot place this pod fairly`;
    return rec;
  }
  if ((pod.restarts | 0) > 5) {
    rec.action = 'investigate';
    rec.reason = `${pod.restarts} restarts — check OOMKilled/evicted events before raising limits`;
    return rec;
  }
  if (cpuLim > 0 && cpuReq > 0 && cpuLim > cpuReq * 4) {
    rec.action = 'tighten';
    rec.reason = `CPU limit (${pod.cpu_limit}) is ${(cpuLim / cpuReq).toFixed(0)}x the request (${pod.cpu_request}) — the scheduler reserves only the request, so this pod is over-committed and evicted first; set the request from measured usage or lower the limit`;
    return rec;
  }
  if ((pod.restarts | 0) > 0) {
    rec.action = 'watch';
    rec.reason = `${pod.restarts} restart(s) — not enough evidence to change resources`;
  }
  return rec;
}

/* =============== demo data & rendering =============== */
const ACTIONS = ['fix','set','investigate','tighten','watch','keep'];
const SAMPLE = [
  { name: 'api-gateway-7d9f', namespace: 'default', status: 'Running', restarts: 0, containers: 2, cpu_request: '500m', cpu_limit: '2', memory_request: '512Mi', memory_limit: '1Gi' },
  { name: 'cache-0', namespace: 'infra', status: 'Running', restarts: 0, containers: 1, cpu_request: '100m', cpu_limit: '', memory_request: '', memory_limit: '' },
  { name: 'debug-toolkit', namespace: 'default', status: 'Running', restarts: 0, containers: 1, cpu_request: '2', cpu_limit: '1', memory_request: '4Gi', memory_limit: '2Gi' },
  { name: 'batch-etl-1', namespace: 'jobs', status: 'Running', restarts: 8, containers: 1, cpu_request: '1', cpu_limit: '2', memory_request: '1Gi', memory_limit: '2Gi' },
  { name: 'frontend', namespace: 'web', status: 'Running', restarts: 0, containers: 1, cpu_request: '100m', cpu_limit: '4', memory_request: '256Mi', memory_limit: '1Gi' },
  { name: 'worker-queue-3', namespace: 'jobs', status: 'Running', restarts: 2, containers: 3, cpu_request: '250m', cpu_limit: '500m', memory_request: '512Mi', memory_limit: '1Gi' },
  { name: 'metrics-agent', namespace: 'monitoring', status: 'Running', restarts: 0, containers: 1, cpu_request: '', cpu_limit: '', memory_request: '', memory_limit: '' },
  { name: 'ml-trainer-0', namespace: 'ml', status: 'Running', restarts: 1, containers: 1, cpu_request: '2', cpu_limit: '4', memory_request: '8Gi', memory_limit: '16Gi' },
];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let recommendations = [], activeFilter = 'all';

function analyze() {
  const raw = $('pods').value.trim();
  let pods = [];
  if (raw) {
    try {
      pods = JSON.parse(raw);
      if (!Array.isArray(pods)) throw new Error('Expected a JSON array of pod objects');
    } catch (e) {
      $('tbody').innerHTML = `<tr><td colspan="5"><div class="err-box">Invalid JSON: ${esc(e.message)}</div></td></tr>`;
      $('cards').innerHTML = ''; $('rowCount').textContent = '';
      Sound.bad();
      return;
    }
  } else {
    pods = SAMPLE;
  }
  recommendations = pods.map(recommend);
  Sound.analyze();
  if (recommendations.length && recommendations.every(r => r.action === 'keep')) Sound.clean();
  else if (recommendations.some(r => r.action === 'fix')) Sound.bad();
  render();
}
function actionCounts() {
  const c = Object.fromEntries(ACTIONS.map(a => [a, 0]));
  recommendations.forEach(r => c[r.action]++);
  return c;
}
function renderCards() {
  const counts = actionCounts();
  const allChip = `<button class="card ${activeFilter === 'all' ? 'active' : ''}" data-filter="all" style="--accent:var(--tighten)"><div class="n">${recommendations.length}</div><div class="l">pods</div></button>`;
  $('cards').innerHTML = allChip + ACTIONS.map(a =>
    `<button class="card ${a} ${activeFilter === a ? 'active' : ''}" data-filter="${a}" style="--accent:${getComputedStyle(document.documentElement).getPropertyValue('--' + a)}"><div class="n">${counts[a]}</div><div class="l">${a}</div></button>`
  ).join('');
  document.querySelectorAll('[data-filter]').forEach(el =>
    el.addEventListener('click', () => { activeFilter = el.dataset.filter; render(); }));
}
function render() {
  renderCards();
  const q = $('search').value.trim().toLowerCase();
  let shown = recommendations.filter(r => {
    if (activeFilter !== 'all' && r.action !== activeFilter) return false;
    if (q) {
      const hay = `${r.pod} ${r.namespace} ${r.action} ${r.reason}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  $('rowCount').textContent = `· ${shown.length} of ${recommendations.length}`;
  if (!shown.length) {
    $('tbody').innerHTML = '<tr><td colspan="5" class="empty">No recommendations match</td></tr>';
    return;
  }
  $('tbody').innerHTML = shown.map(r => `
    <tr>
      <td><code>${esc(r.namespace)}/${esc(r.pod)}</code></td>
      <td><code>${esc(r.current_cpu || '—')}</code><br><code>${esc(r.current_memory || '—')}</code></td>
      <td><code>${esc(r.recommended_cpu || '—')}</code><br><code>${esc(r.recommended_memory || '—')}</code></td>
      <td><span class="badge ${esc(r.action)}">${esc(r.action)}</span></td>
      <td class="reason">${esc(r.reason)}</td>
    </tr>`).join('');
}
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2200); }

$('analyzeBtn').addEventListener('click', analyze);
$('pods').addEventListener('input', () => { $('hint').textContent = '· editing…'; });
$('search').addEventListener('input', render);
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); analyze(); }
});
$('sampleBtn').addEventListener('click', () => { $('pods').value = JSON.stringify(SAMPLE, null, 2); analyze(); });
$('copyBtn').addEventListener('click', async () => {
  if (!recommendations.length) return toast('Run an analysis first');
  await navigator.clipboard.writeText(JSON.stringify(recommendations, null, 2));
  Sound.copy(); toast('Recommendations copied as JSON');
});
$('soundBtn').addEventListener('click', () => { const m = Sound.toggleMute(); toast(m ? 'Sound off' : 'Sound on'); });

// seed the demo on load
$('pods').value = JSON.stringify(SAMPLE, null, 2);
analyze();
</script>
</body>
</html>
